name: Deploy to examprep.sanketbilas.online

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zero-dependency project (see package.json) — no build step, the checked-out
      # source is deployed as-is. local-dir/server-dir are "./" because DEPLOY_FTP_USER
      # should be an FTP account scoped to /home/sanketbi/examprep.sanketbilas.online,
      # so its FTP root already *is* the deploy target.
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_FTP_USER }}
          password: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          protocol: ${{ vars.DEPLOY_FTP_PROTOCOL }}
          local-dir: ./
          server-dir: ./
          exclude: |
            .git*
            .git*/**
            .github/**
            node_modules/**
            data.db
            .env

      # The FTP sync above only uploads files that changed, so tmp/restart.txt (whose
      # content never changes) wouldn't get a fresh mtime on its own. Passenger
      # restarts the app whenever that file's mtime changes, so force it every run.
      - name: Force a Passenger restart
        env:
          FTP_HOST: ${{ vars.DEPLOY_HOST }}
          FTP_PROTOCOL: ${{ vars.DEPLOY_FTP_PROTOCOL }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: |
          date -u +"restart requested at %Y-%m-%dT%H:%M:%SZ" > restart.txt
          SCHEME="ftp"
          if [ "$FTP_PROTOCOL" = "ftps" ] || [ "$FTP_PROTOCOL" = "ftps-legacy" ]; then
            CURL_TLS_FLAG="--ssl-reqd"
          else
            CURL_TLS_FLAG=""
          fi
          curl --ftp-create-dirs $CURL_TLS_FLAG -T restart.txt \
            --user "$FTP_USER:$FTP_PASSWORD" "$SCHEME://$FTP_HOST/tmp/restart.txt"
