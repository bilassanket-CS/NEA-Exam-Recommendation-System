name: Deploy to examprep.sanketbilas.online

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Passenger restarts the app whenever tmp/restart.txt's mtime changes. Write a
      # fresh timestamp into it before syncing, so the FTP step below (which only
      # uploads files whose content changed) always re-uploads it and bumps its mtime
      # on the server — no separate connection/step needed to "touch" it remotely.
      - name: Prepare restart signal
        run: |
          mkdir -p tmp
          date -u +"restart requested at %Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      # Zero-dependency project (see package.json) — no build step, the checked-out
      # source is deployed as-is. local-dir/server-dir are "./" because DEPLOY_FTP_USER
      # should be an FTP account scoped to /home/sanketbi/examprep.sanketbilas.online,
      # so its FTP root already *is* the deploy target.
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_FTP_USER }}
          password: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          protocol: ${{ vars.DEPLOY_FTP_PROTOCOL }}
          local-dir: ./
          server-dir: ./
          exclude: |
            .git*
            .git*/**
            .github/**
            node_modules/**
            data.db
            .env
